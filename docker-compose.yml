version: '3.8'

services:
  gamebot:
    build: .
    container_name: kakao_game_bot
    restart: unless-stopped
    ports:
      - "5000:5000"  # 웹훅 서버 포트
    environment:
      - PLATFORM=kakao
      - INITIAL_POINTS=${INITIAL_POINTS:-100}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5000
      # 데이터베이스 파일 경로 (볼륨 마운트 경로 사용)
      - POINTS_DATA_FILE=/app/data/points_data.db
      - NUMBER_GUESS_ENTRY_COST=${NUMBER_GUESS_ENTRY_COST:-10}
      - NUMBER_GUESS_BASE_REWARD=${NUMBER_GUESS_BASE_REWARD:-50}
      - RPS_WIN_REWARD=${RPS_WIN_REWARD:-10}
      - RPS_LOSE_COST=${RPS_LOSE_COST:-5}
      - ENHANCEMENT_BASE_COST=${ENHANCEMENT_BASE_COST:-40}
    volumes:
      # 데이터베이스 파일 영구 저장 (명명된 볼륨 사용)
      - gamebot_data:/app/data
      # 바인드 마운트로 데이터베이스 접근 (로컬 개발용, 선택사항)
      # 주석 해제하면 호스트의 ./data 디렉토리와 동기화됨
      # - ./data:/app/data
      # .env 파일 마운트 (선택사항, 로컬 개발용)
      - ./.env:/app/.env:ro
      # 로그 파일 저장 (명명된 볼륨)
      - gamebot_logs:/app/logs
    networks:
      - gamebot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  # 데이터베이스 및 게임 데이터 저장
  gamebot_data:
    driver: local
  # 로그 파일 저장
  gamebot_logs:
    driver: local

networks:
  gamebot-network:
    driver: bridge


services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:15-alpine
    container_name: kakao_game_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kakao_game}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - gamebot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (Kafka 의존성)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kakao_game_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Reduce noisy INFO logs when clients close the connection immediately (e.g., healthchecks)
      KAFKA_OPTS: "-Dzookeeper.root.logger=WARN,CONSOLE"
      ZOOKEEPER_LOG4J_PROP: "WARN,CONSOLE"
    networks:
      - gamebot-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kakao_game_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - gamebot-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx 리버스 프록시
  nginx:
    image: nginx:alpine
    container_name: kakao_game_nginx
    restart: unless-stopped
    depends_on:
      gamebot:
        condition: service_healthy
    ports:
      - "${EXTERNAL_PORT:-3000}:80"  # 외부 포트 (기본값: 3000, Jenkins가 8080 사용 중)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
    environment:
      # 공식 entrypoint 스크립트가 기본 conf를 수정하려고 시도할 때 읽기 전용 볼륨으로 인한 에러를 방지
      - DISABLE_IPV6=true
    networks:
      - gamebot-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Kafka 이벤트 워커 (비동기 처리)
  worker:
    build: .
    container_name: kakao_game_worker
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command: python -m workers.event_consumer
    environment:
      # Kafka 설정
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - USE_KAFKA=${USE_KAFKA:-true}
      # 로깅
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - gamebot-network

  # Discord 봇 서비스
  gamebot:
    build: .
    container_name: kakao_game_gamebot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: python main.py
    environment:
      - PLATFORM=${PLATFORM:-discord}
      - INITIAL_POINTS=${INITIAL_POINTS:-100}
      # Discord 설정
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_COMMAND_PREFIX=${DISCORD_COMMAND_PREFIX:-/}
      # PostgreSQL 설정
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-kakao_game}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      # Kafka 설정
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - USE_KAFKA=${USE_KAFKA:-true}
      # 게임 설정
      - NUMBER_GUESS_ENTRY_COST=${NUMBER_GUESS_ENTRY_COST:-10}
      - NUMBER_GUESS_BASE_REWARD=${NUMBER_GUESS_BASE_REWARD:-50}
      - RPS_WIN_REWARD=${RPS_WIN_REWARD:-10}
      - RPS_LOSE_COST=${RPS_LOSE_COST:-5}
      - ENHANCEMENT_BASE_COST=${ENHANCEMENT_BASE_COST:-40}
      # 로깅
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # .env 파일 마운트 (선택사항, 로컬 개발용)
      - ./.env:/app/.env:ro
      # 로그 파일 저장
      - gamebot_logs:/app/logs
    networks:
      - gamebot-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pgrep -f 'python .*main.py' >/dev/null || pgrep -f 'python .*run_server.py' >/dev/null"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  # PostgreSQL 데이터 저장
  postgres_data:
    driver: local
  # 로그 파일 저장
  gamebot_logs:
    driver: local
  # Nginx 로그 저장
  nginx_logs:
    driver: local

networks:
  gamebot-network:
    driver: bridge

